<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudFen 3D Logo</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  overflow: hidden;
  font-family: system-ui, sans-serif;
}

#canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

.loader {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #4fd1c5;
  font-size: 14px;
  letter-spacing: 0.05em;
  opacity: 0.6;
  z-index: 10;
  transition: opacity 0.5s;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="loader" id="loader">LOADING</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('canvas');
const loader = document.getElementById('loader');

console.log('Three.js loaded:', THREE.REVISION);

// Scene setup
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.015);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 50);

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

// Lighting
const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
keyLight.position.set(5, 10, 8);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x4fd1c5, 0.8);
rimLight.position.set(-5, -3, -5);
scene.add(rimLight);

const ambientLight = new THREE.AmbientLight(0x1a1a1a, 0.4);
scene.add(ambientLight);

// Atmospheric particles
const particleCount = 150;
const particleGeometry = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount * 3; i += 3) {
  particlePositions[i] = (Math.random() - 0.5) * 80;
  particlePositions[i + 1] = (Math.random() - 0.5) * 60;
  particlePositions[i + 2] = (Math.random() - 0.5) * 40 - 20;
}

particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

const particleMaterial = new THREE.PointsMaterial({
  color: 0x4fd1c5,
  size: 0.08,
  transparent: true,
  opacity: 0.3,
  blending: THREE.AdditiveBlending
});

const particles = new THREE.Points(particleGeometry, particleMaterial);
scene.add(particles);

// Materials
const whiteMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  metalness: 0.2,
  roughness: 0.3,
  emissive: 0xffffff,
  emissiveIntensity: 0.05
});

const turquoiseMaterial = new THREE.MeshStandardMaterial({
  color: 0x4fd1c5,
  metalness: 0.4,
  roughness: 0.25,
  emissive: 0x4fd1c5,
  emissiveIntensity: 0.3
});

// Create letter shapes
function createLetterC() {
  const group = new THREE.Group();
  const shape = new THREE.Shape();

  const outerRadius = 2;
  const innerRadius = 1.4;
  const startAngle = Math.PI * 0.25;
  const endAngle = Math.PI * 1.75;

  shape.absarc(0, 0, outerRadius, startAngle, endAngle, false);
  shape.absarc(0, 0, innerRadius, endAngle, startAngle, true);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.5,
    bevelEnabled: true,
    bevelThickness: 0.1,
    bevelSize: 0.1,
    bevelSegments: 3
  });
  geometry.center();

  const mesh = new THREE.Mesh(geometry, whiteMaterial);
  group.add(mesh);
  return group;
}

function createLetterL() {
  const group = new THREE.Group();
  const shape = new THREE.Shape();

  shape.moveTo(0, 0);
  shape.lineTo(0, 3.5);
  shape.lineTo(0.8, 3.5);
  shape.lineTo(0.8, 0.8);
  shape.lineTo(2.2, 0.8);
  shape.lineTo(2.2, 0);
  shape.lineTo(0, 0);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.5,
    bevelEnabled: true,
    bevelThickness: 0.1,
    bevelSize: 0.08,
    bevelSegments: 3
  });

  const mesh = new THREE.Mesh(geometry, whiteMaterial);
  group.add(mesh);
  return group;
}

function createLetterO() {
  const group = new THREE.Group();
  const shape = new THREE.Shape();

  shape.absarc(0, 0, 1.8, 0, Math.PI * 2, false);
  const holePath = new THREE.Path();
  holePath.absarc(0, 0, 1.1, 0, Math.PI * 2, true);
  shape.holes.push(holePath);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.5,
    bevelEnabled: true,
    bevelThickness: 0.1,
    bevelSize: 0.08,
    bevelSegments: 3
  });

  const mesh = new THREE.Mesh(geometry, whiteMaterial);
  group.add(mesh);
  return group;
}

function createLetterU() {
  const group = new THREE.Group();
  const shape = new THREE.Shape();

  shape.moveTo(0, 3.5);
  shape.lineTo(0, 1.2);
  shape.quadraticCurveTo(0, 0.5, 0.5, 0.2);
  shape.quadraticCurveTo(1.1, 0, 1.6, 0);
  shape.quadraticCurveTo(2.1, 0, 2.6, 0.2);
  shape.quadraticCurveTo(3.2, 0.5, 3.2, 1.2);
  shape.lineTo(3.2, 3.5);
  shape.lineTo(2.4, 3.5);
  shape.lineTo(2.4, 1.2);
  shape.quadraticCurveTo(2.4, 0.9, 2.1, 0.75);
  shape.quadraticCurveTo(1.9, 0.65, 1.6, 0.65);
  shape.quadraticCurveTo(1.3, 0.65, 1.1, 0.75);
  shape.quadraticCurveTo(0.8, 0.9, 0.8, 1.2);
  shape.lineTo(0.8, 3.5);
  shape.lineTo(0, 3.5);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.5,
    bevelEnabled: true,
    bevelThickness: 0.1,
    bevelSize: 0.08,
    bevelSegments: 3
  });

  const mesh = new THREE.Mesh(geometry, whiteMaterial);
  group.add(mesh);
  return group;
}

function createLetterD() {
  const group = new THREE.Group();
  const shape = new THREE.Shape();

  shape.moveTo(0, 0);
  shape.lineTo(0, 3.5);
  shape.lineTo(1.2, 3.5);
  shape.quadraticCurveTo(2.5, 3.5, 3, 2.5);
  shape.quadraticCurveTo(3.2, 1.75, 3.2, 1.75);
  shape.quadraticCurveTo(3, 0.85, 2.5, 0.4);
  shape.quadraticCurveTo(1.8, 0, 1.2, 0);
  shape.lineTo(0, 0);

  const holePath = new THREE.Path();
  holePath.moveTo(0.8, 0.7);
  holePath.lineTo(1.2, 0.7);
  holePath.quadraticCurveTo(1.9, 0.7, 2.2, 1.2);
  holePath.quadraticCurveTo(2.4, 1.75, 2.2, 2.3);
  holePath.quadraticCurveTo(1.9, 2.8, 1.2, 2.8);
  holePath.lineTo(0.8, 2.8);
  holePath.lineTo(0.8, 0.7);
  shape.holes.push(holePath);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.5,
    bevelEnabled: true,
    bevelThickness: 0.1,
    bevelSize: 0.08,
    bevelSegments: 3
  });

  const mesh = new THREE.Mesh(geometry, whiteMaterial);
  group.add(mesh);
  return group;
}

function createTurquoiseEmblem() {
  const group = new THREE.Group();

  const circleGeometry = new THREE.TorusGeometry(1.1, 0.15, 16, 32);
  const circleMesh = new THREE.Mesh(circleGeometry, turquoiseMaterial);
  group.add(circleMesh);

  const dotGeometry = new THREE.SphereGeometry(0.08, 8, 8);
  const dotCount = 16;
  const radiusInner = 0.4;
  const radiusOuter = 0.85;

  for (let i = 0; i < dotCount; i++) {
    const angle = (i / dotCount) * Math.PI * 2;
    const radius = i % 2 === 0 ? radiusInner : radiusOuter;
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius;

    const dot = new THREE.Mesh(dotGeometry, turquoiseMaterial);
    dot.position.set(x, y, 0.1);
    group.add(dot);
  }

  const centerGeometry = new THREE.CylinderGeometry(0.15, 0.15, 0.3, 16);
  centerGeometry.rotateX(Math.PI / 2);
  const centerMesh = new THREE.Mesh(centerGeometry, turquoiseMaterial);
  group.add(centerMesh);

  return group;
}

// Create logo elements
const letterC = createLetterC();
const letterL = createLetterL();
const letterO = createLetterO();
const letterU = createLetterU();
const letterD = createLetterD();
const emblem = createTurquoiseEmblem();

// Position data
const elements = [
  { mesh: letterC, start: { x: -30, y: 10, z: -20 }, end: { x: -11, y: 0, z: 0 }, rotation: { x: 0.3, y: -0.5, z: 0.2 } },
  { mesh: letterL, start: { x: -20, y: -15, z: 15 }, end: { x: -6, y: -1.7, z: 0 }, rotation: { x: -0.4, y: 0.3, z: -0.1 } },
  { mesh: letterO, start: { x: 0, y: 20, z: -15 }, end: { x: -2.5, y: 0, z: 0 }, rotation: { x: 0.2, y: 0.4, z: 0.3 } },
  { mesh: letterU, start: { x: 25, y: -10, z: 10 }, end: { x: 2, y: -1.7, z: 0 }, rotation: { x: -0.3, y: -0.4, z: 0.2 } },
  { mesh: letterD, start: { x: 35, y: 5, z: -25 }, end: { x: 7, y: -1.7, z: 0 }, rotation: { x: 0.5, y: 0.2, z: -0.3 } },
  { mesh: emblem, start: { x: 0, y: 0, z: -40 }, end: { x: -2.5, y: 0, z: 0 }, rotation: { x: 0, y: 0, z: 0 } }
];

// Set initial positions
elements.forEach(el => {
  el.mesh.position.set(el.start.x, el.start.y, el.start.z);
  el.mesh.rotation.set(el.rotation.x, el.rotation.y, el.rotation.z);
  el.mesh.visible = false;
  scene.add(el.mesh);
});

// Animation timeline
const timeline = {
  duration: 11000,
  startTime: Date.now() + 1000
};

// Hide loader
setTimeout(() => {
  loader.style.opacity = '0';
  setTimeout(() => loader.style.display = 'none', 500);
}, 1000);

// Easing functions
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// Animation loop
function animate() {
  requestAnimationFrame(animate);

  const elapsed = Date.now() - timeline.startTime;
  const progress = Math.min(Math.max(elapsed / timeline.duration, 0), 1);

  // Camera dolly
  if (progress < 0.7) {
    camera.position.z = 50 - easeOutCubic(progress / 0.7) * 15;
  }

  // Emblem reveal (0-3s)
  if (progress < 0.27) {
    const p = progress / 0.27;
    emblem.visible = true;
    emblem.position.z = emblem.start.z + easeOutCubic(p) * (emblem.end.z - emblem.start.z);
    emblem.rotation.z = p * Math.PI * 2;
    turquoiseMaterial.emissiveIntensity = 0.3 + p * 0.3;
  }

  // Letter C (2-4s)
  if (progress >= 0.18 && progress < 0.36) {
    const p = (progress - 0.18) / 0.18;
    letterC.visible = true;
    letterC.position.x = letterC.start.x + easeInOutCubic(p) * (letterC.end.x - letterC.start.x);
    letterC.position.y = letterC.start.y + easeInOutCubic(p) * (letterC.end.y - letterC.start.y);
    letterC.position.z = letterC.start.z + easeInOutCubic(p) * (letterC.end.z - letterC.start.z);
    letterC.rotation.x = elements[0].rotation.x * (1 - easeInOutCubic(p));
    letterC.rotation.y = elements[0].rotation.y * (1 - easeInOutCubic(p));
    letterC.rotation.z = elements[0].rotation.z * (1 - easeInOutCubic(p));
  }

  // Letter L (2.5-4.5s)
  if (progress >= 0.23 && progress < 0.41) {
    const p = (progress - 0.23) / 0.18;
    letterL.visible = true;
    letterL.position.x = letterL.start.x + easeInOutCubic(p) * (letterL.end.x - letterL.start.x);
    letterL.position.y = letterL.start.y + easeInOutCubic(p) * (letterL.end.y - letterL.start.y);
    letterL.position.z = letterL.start.z + easeInOutCubic(p) * (letterL.end.z - letterL.start.z);
    letterL.rotation.x = elements[1].rotation.x * (1 - easeInOutCubic(p));
    letterL.rotation.y = elements[1].rotation.y * (1 - easeInOutCubic(p));
    letterL.rotation.z = elements[1].rotation.z * (1 - easeInOutCubic(p));
  }

  // Letter O (3-5s)
  if (progress >= 0.27 && progress < 0.45) {
    const p = (progress - 0.27) / 0.18;
    letterO.visible = true;
    letterO.position.x = letterO.start.x + easeInOutCubic(p) * (letterO.end.x - letterO.start.x);
    letterO.position.y = letterO.start.y + easeInOutCubic(p) * (letterO.end.y - letterO.start.y);
    letterO.position.z = letterO.start.z + easeInOutCubic(p) * (letterO.end.z - letterO.start.z);
    letterO.rotation.x = elements[2].rotation.x * (1 - easeInOutCubic(p));
    letterO.rotation.y = elements[2].rotation.y * (1 - easeInOutCubic(p));
    letterO.rotation.z = elements[2].rotation.z * (1 - easeInOutCubic(p));
  }

  // Letter U (3.5-5.5s)
  if (progress >= 0.32 && progress < 0.5) {
    const p = (progress - 0.32) / 0.18;
    letterU.visible = true;
    letterU.position.x = letterU.start.x + easeInOutCubic(p) * (letterU.end.x - letterU.start.x);
    letterU.position.y = letterU.start.y + easeInOutCubic(p) * (letterU.end.y - letterU.start.y);
    letterU.position.z = letterU.start.z + easeInOutCubic(p) * (letterU.end.z - letterU.start.z);
    letterU.rotation.x = elements[3].rotation.x * (1 - easeInOutCubic(p));
    letterU.rotation.y = elements[3].rotation.y * (1 - easeInOutCubic(p));
    letterU.rotation.z = elements[3].rotation.z * (1 - easeInOutCubic(p));
  }

  // Letter D (4-6s)
  if (progress >= 0.36 && progress < 0.55) {
    const p = (progress - 0.36) / 0.19;
    letterD.visible = true;
    letterD.position.x = letterD.start.x + easeInOutCubic(p) * (letterD.end.x - letterD.start.x);
    letterD.position.y = letterD.start.y + easeInOutCubic(p) * (letterD.end.y - letterD.start.y);
    letterD.position.z = letterD.start.z + easeInOutCubic(p) * (letterD.end.z - letterD.start.z);
    letterD.rotation.x = elements[4].rotation.x * (1 - easeInOutCubic(p));
    letterD.rotation.y = elements[4].rotation.y * (1 - easeInOutCubic(p));
    letterD.rotation.z = elements[4].rotation.z * (1 - easeInOutCubic(p));
  }

  // Energy pulse (6-6.5s)
  if (progress >= 0.55 && progress < 0.59) {
    const p = (progress - 0.55) / 0.04;
    const intensity = Math.sin(p * Math.PI);
    turquoiseMaterial.emissiveIntensity = 0.6 + intensity * 1.2;
    whiteMaterial.emissiveIntensity = 0.05 + intensity * 0.3;
    const scale = 1 + intensity * 0.05;
    emblem.scale.set(scale, scale, scale);
  } else if (progress >= 0.59) {
    emblem.scale.set(1, 1, 1);
  }

  // Orbital camera (6.5-9s)
  if (progress >= 0.59 && progress < 0.82) {
    const p = (progress - 0.59) / 0.23;
    const angle = easeInOutCubic(p) * Math.PI * 0.15;
    camera.position.x = Math.sin(angle) * 10.5;
    camera.position.z = 35 + Math.cos(angle) * 3.5;
    camera.lookAt(0, 0, 0);
  }

  // Light sweep (9-10s)
  if (progress >= 0.82 && progress < 0.91) {
    const p = (progress - 0.82) / 0.09;
    keyLight.intensity = 1.5 + Math.sin(p * Math.PI) * 0.8;
    rimLight.intensity = 0.8 + Math.sin(p * Math.PI) * 0.5;
  }

  // Final hold (10-11s)
  if (progress >= 0.91) {
    keyLight.intensity = 1.5;
    rimLight.intensity = 0.8;
    turquoiseMaterial.emissiveIntensity = 0.6;
    whiteMaterial.emissiveIntensity = 0.05;
    camera.position.set(0, 0, 35);
    camera.lookAt(0, 0, 0);
    emblem.rotation.z += 0.003;
  }

  // Particle drift
  particles.rotation.y += 0.0002;
  particles.rotation.x += 0.0001;

  renderer.render(scene, camera);
}

// Window resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start
animate();
console.log('Animation started');
</script>

</body>
</html>
