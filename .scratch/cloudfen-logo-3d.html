<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudFen 3D Logo Animation</title>
<style>
:root {
  --bg: #000000;
  --text: #ffffff;
  --accent: #4fd1c5;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
}

#canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

.loader {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: var(--accent);
  font-size: 14px;
  letter-spacing: 0.05em;
  opacity: 0.6;
  z-index: 10;
  transition: opacity 0.5s;
}

.error {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ff6b6b;
  font-size: 14px;
  text-align: center;
  max-width: 80%;
  display: none;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="loader" id="loader">LOADING</div>
<div class="error" id="error"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js" onerror="handleLoadError()"></script>
<script>
function handleLoadError() {
  document.getElementById('loader').style.display = 'none';
  const errorEl = document.getElementById('error');
  errorEl.textContent = 'Failed to load Three.js library. Please check your internet connection.';
  errorEl.style.display = 'block';
}

// Wait for Three.js to load
function initScene() {
  if (typeof THREE === 'undefined') {
    setTimeout(initScene, 100);
    return;
  }

  try {
    const canvas = document.getElementById('canvas');
    const loader = document.getElementById('loader');

    // Scene setup
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 50);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    // Lighting
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
    keyLight.position.set(5, 10, 8);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x4fd1c5, 0.8);
    rimLight.position.set(-5, -3, -5);
    scene.add(rimLight);

    const ambientLight = new THREE.AmbientLight(0x1a1a1a, 0.4);
    scene.add(ambientLight);

    // Atmospheric particles
    const particleCount = 150;
    const particleGeometry = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount * 3; i += 3) {
      particlePositions[i] = (Math.random() - 0.5) * 80;
      particlePositions[i + 1] = (Math.random() - 0.5) * 60;
      particlePositions[i + 2] = (Math.random() - 0.5) * 40 - 20;
    }

    particleGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

    const particleMaterial = new THREE.PointsMaterial({
      color: 0x4fd1c5,
      size: 0.08,
      transparent: true,
      opacity: 0.3,
      blending: THREE.AdditiveBlending
    });

    const particles = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particles);

    // Material definitions
    const whiteMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      metalness: 0.2,
      roughness: 0.3,
      emissive: 0xffffff,
      emissiveIntensity: 0.05
    });

    const turquoiseMaterial = new THREE.MeshStandardMaterial({
      color: 0x4fd1c5,
      metalness: 0.4,
      roughness: 0.25,
      emissive: 0x4fd1c5,
      emissiveIntensity: 0.3
    });

    // Create 3D text using shapes
    function createLetterC() {
      const group = new THREE.Group();
      const shape = new THREE.Shape();

      const outerRadius = 2;
      const innerRadius = 1.4;
      const startAngle = Math.PI * 0.25;
      const endAngle = Math.PI * 1.75;

      shape.absarc(0, 0, outerRadius, startAngle, endAngle, false);
      shape.absarc(0, 0, innerRadius, endAngle, startAngle, true);

      const extrudeSettings = {
        depth: 0.5,
        bevelEnabled: true,
        bevelThickness: 0.1,
        bevelSize: 0.1,
        bevelSegments: 3
      };

      const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geometry.center();

      const mesh = new THREE.Mesh(geometry, whiteMaterial);
      group.add(mesh);
      return group;
    }

    function createLetterL() {
      const group = new THREE.Group();
      const shape = new THREE.Shape();

      shape.moveTo(0, 0);
      shape.lineTo(0, 3.5);
      shape.lineTo(0.8, 3.5);
      shape.lineTo(0.8, 0.8);
      shape.lineTo(2.2, 0.8);
      shape.lineTo(2.2, 0);
      shape.lineTo(0, 0);

      const extrudeSettings = {
        depth: 0.5,
        bevelEnabled: true,
        bevelThickness: 0.1,
        bevelSize: 0.08,
        bevelSegments: 3
      };

      const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      const mesh = new THREE.Mesh(geometry, whiteMaterial);
      group.add(mesh);
      return group;
    }

    function createLetterO() {
      const group = new THREE.Group();
      const shape = new THREE.Shape();

      const outerRadius = 1.8;
      const innerRadius = 1.1;

      shape.absarc(0, 0, outerRadius, 0, Math.PI * 2, false);
      const holePath = new THREE.Path();
      holePath.absarc(0, 0, innerRadius, 0, Math.PI * 2, true);
      shape.holes.push(holePath);

      const extrudeSettings = {
        depth: 0.5,
        bevelEnabled: true,
        bevelThickness: 0.1,
        bevelSize: 0.08,
        bevelSegments: 3
      };

      const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      const mesh = new THREE.Mesh(geometry, whiteMaterial);
      group.add(mesh);
      return group;
    }

    function createLetterU() {
      const group = new THREE.Group();
      const shape = new THREE.Shape();

      shape.moveTo(0, 3.5);
      shape.lineTo(0, 1.2);
      shape.quadraticCurveTo(0, 0.5, 0.5, 0.2);
      shape.quadraticCurveTo(1.1, 0, 1.6, 0);
      shape.quadraticCurveTo(2.1, 0, 2.6, 0.2);
      shape.quadraticCurveTo(3.2, 0.5, 3.2, 1.2);
      shape.lineTo(3.2, 3.5);
      shape.lineTo(2.4, 3.5);
      shape.lineTo(2.4, 1.2);
      shape.quadraticCurveTo(2.4, 0.9, 2.1, 0.75);
      shape.quadraticCurveTo(1.9, 0.65, 1.6, 0.65);
      shape.quadraticCurveTo(1.3, 0.65, 1.1, 0.75);
      shape.quadraticCurveTo(0.8, 0.9, 0.8, 1.2);
      shape.lineTo(0.8, 3.5);
      shape.lineTo(0, 3.5);

      const extrudeSettings = {
        depth: 0.5,
        bevelEnabled: true,
        bevelThickness: 0.1,
        bevelSize: 0.08,
        bevelSegments: 3
      };

      const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      const mesh = new THREE.Mesh(geometry, whiteMaterial);
      group.add(mesh);
      return group;
    }

    function createLetterD() {
      const group = new THREE.Group();
      const shape = new THREE.Shape();

      shape.moveTo(0, 0);
      shape.lineTo(0, 3.5);
      shape.lineTo(1.2, 3.5);
      shape.quadraticCurveTo(2.5, 3.5, 3, 2.5);
      shape.quadraticCurveTo(3.2, 1.75, 3.2, 1.75);
      shape.quadraticCurveTo(3, 0.85, 2.5, 0.4);
      shape.quadraticCurveTo(1.8, 0, 1.2, 0);
      shape.lineTo(0, 0);

      const holePath = new THREE.Path();
      holePath.moveTo(0.8, 0.7);
      holePath.lineTo(1.2, 0.7);
      holePath.quadraticCurveTo(1.9, 0.7, 2.2, 1.2);
      holePath.quadraticCurveTo(2.4, 1.75, 2.2, 2.3);
      holePath.quadraticCurveTo(1.9, 2.8, 1.2, 2.8);
      holePath.lineTo(0.8, 2.8);
      holePath.lineTo(0.8, 0.7);
      shape.holes.push(holePath);

      const extrudeSettings = {
        depth: 0.5,
        bevelEnabled: true,
        bevelThickness: 0.1,
        bevelSize: 0.08,
        bevelSegments: 3
      };

      const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      const mesh = new THREE.Mesh(geometry, whiteMaterial);
      group.add(mesh);
      return group;
    }

    function createTurquoiseEmblem() {
      const group = new THREE.Group();

      // Outer circle
      const circleGeometry = new THREE.TorusGeometry(1.1, 0.15, 16, 32);
      const circleMesh = new THREE.Mesh(circleGeometry, turquoiseMaterial);
      group.add(circleMesh);

      // Inner radial pattern (cloud-inspired dots)
      const dotGeometry = new THREE.SphereGeometry(0.08, 8, 8);
      const dotCount = 16;
      const radiusInner = 0.4;
      const radiusOuter = 0.85;

      for (let i = 0; i < dotCount; i++) {
        const angle = (i / dotCount) * Math.PI * 2;
        const radius = i % 2 === 0 ? radiusInner : radiusOuter;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;

        const dot = new THREE.Mesh(dotGeometry, turquoiseMaterial);
        dot.position.set(x, y, 0.1);
        group.add(dot);
      }

      // Central element
      const centerGeometry = new THREE.CylinderGeometry(0.15, 0.15, 0.3, 16);
      centerGeometry.rotateX(Math.PI / 2);
      const centerMesh = new THREE.Mesh(centerGeometry, turquoiseMaterial);
      group.add(centerMesh);

      return group;
    }

    // Create logo elements
    const letterC = createLetterC();
    const letterL = createLetterL();
    const letterO = createLetterO();
    const letterU = createLetterU();
    const letterD = createLetterD();
    const emblem = createTurquoiseEmblem();

    // Store initial and final positions
    const elements = [
      { mesh: letterC, start: { x: -30, y: 10, z: -20 }, end: { x: -11, y: 0, z: 0 }, rotation: { x: 0.3, y: -0.5, z: 0.2 } },
      { mesh: letterL, start: { x: -20, y: -15, z: 15 }, end: { x: -6, y: -1.7, z: 0 }, rotation: { x: -0.4, y: 0.3, z: -0.1 } },
      { mesh: letterO, start: { x: 0, y: 20, z: -15 }, end: { x: -2.5, y: 0, z: 0 }, rotation: { x: 0.2, y: 0.4, z: 0.3 } },
      { mesh: letterU, start: { x: 25, y: -10, z: 10 }, end: { x: 2, y: -1.7, z: 0 }, rotation: { x: -0.3, y: -0.4, z: 0.2 } },
      { mesh: letterD, start: { x: 35, y: 5, z: -25 }, end: { x: 7, y: -1.7, z: 0 }, rotation: { x: 0.5, y: 0.2, z: -0.3 } },
      { mesh: emblem, start: { x: 0, y: 0, z: -40 }, end: { x: -2.5, y: 0, z: 0 }, rotation: { x: 0, y: 0, z: 0 } }
    ];

    // Set initial positions and add to scene
    elements.forEach(el => {
      el.mesh.position.set(el.start.x, el.start.y, el.start.z);
      el.mesh.rotation.set(el.rotation.x, el.rotation.y, el.rotation.z);
      el.mesh.visible = false;
      scene.add(el.mesh);
    });

    // Animation timeline
    const timeline = {
      duration: 11000,
      startTime: Date.now() + 1000,
      phase: 'animating'
    };

    // Hide loader after a short delay
    setTimeout(() => {
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display = 'none', 500);
    }, 1000);

    // Easing functions
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      const now = Date.now();

      if (timeline.phase === 'animating' && timeline.startTime) {
        const elapsed = now - timeline.startTime;
        const progress = Math.min(elapsed / timeline.duration, 1);

        // Camera movement (dolly in)
        if (progress < 0.7) {
          const camProgress = progress / 0.7;
          camera.position.z = 50 - easeOutCubic(camProgress) * 15;
        }

        // Emblem reveal and rotation (0-3s)
        if (progress < 0.27) {
          const emblemProgress = progress / 0.27;
          emblem.visible = true;
          emblem.position.z = emblem.start.z + easeOutCubic(emblemProgress) * (emblem.end.z - emblem.start.z);
          emblem.rotation.z = emblemProgress * Math.PI * 2;
          turquoiseMaterial.emissiveIntensity = 0.3 + emblemProgress * 0.3;
        }

        // Letter C assembly (2-4s)
        if (progress >= 0.18 && progress < 0.36) {
          const cProgress = (progress - 0.18) / 0.18;
          letterC.visible = true;
          letterC.position.x = letterC.start.x + easeInOutCubic(cProgress) * (letterC.end.x - letterC.start.x);
          letterC.position.y = letterC.start.y + easeInOutCubic(cProgress) * (letterC.end.y - letterC.start.y);
          letterC.position.z = letterC.start.z + easeInOutCubic(cProgress) * (letterC.end.z - letterC.start.z);
          letterC.rotation.x = elements[0].rotation.x * (1 - easeInOutCubic(cProgress));
          letterC.rotation.y = elements[0].rotation.y * (1 - easeInOutCubic(cProgress));
          letterC.rotation.z = elements[0].rotation.z * (1 - easeInOutCubic(cProgress));
        }

        // Letter L assembly (2.5-4.5s)
        if (progress >= 0.23 && progress < 0.41) {
          const lProgress = (progress - 0.23) / 0.18;
          letterL.visible = true;
          letterL.position.x = letterL.start.x + easeInOutCubic(lProgress) * (letterL.end.x - letterL.start.x);
          letterL.position.y = letterL.start.y + easeInOutCubic(lProgress) * (letterL.end.y - letterL.start.y);
          letterL.position.z = letterL.start.z + easeInOutCubic(lProgress) * (letterL.end.z - letterL.start.z);
          letterL.rotation.x = elements[1].rotation.x * (1 - easeInOutCubic(lProgress));
          letterL.rotation.y = elements[1].rotation.y * (1 - easeInOutCubic(lProgress));
          letterL.rotation.z = elements[1].rotation.z * (1 - easeInOutCubic(lProgress));
        }

        // Letter O assembly (3-5s)
        if (progress >= 0.27 && progress < 0.45) {
          const oProgress = (progress - 0.27) / 0.18;
          letterO.visible = true;
          letterO.position.x = letterO.start.x + easeInOutCubic(oProgress) * (letterO.end.x - letterO.start.x);
          letterO.position.y = letterO.start.y + easeInOutCubic(oProgress) * (letterO.end.y - letterO.start.y);
          letterO.position.z = letterO.start.z + easeInOutCubic(oProgress) * (letterO.end.z - letterO.start.z);
          letterO.rotation.x = elements[2].rotation.x * (1 - easeInOutCubic(oProgress));
          letterO.rotation.y = elements[2].rotation.y * (1 - easeInOutCubic(oProgress));
          letterO.rotation.z = elements[2].rotation.z * (1 - easeInOutCubic(oProgress));
        }

        // Letter U assembly (3.5-5.5s)
        if (progress >= 0.32 && progress < 0.5) {
          const uProgress = (progress - 0.32) / 0.18;
          letterU.visible = true;
          letterU.position.x = letterU.start.x + easeInOutCubic(uProgress) * (letterU.end.x - letterU.start.x);
          letterU.position.y = letterU.start.y + easeInOutCubic(uProgress) * (letterU.end.y - letterU.start.y);
          letterU.position.z = letterU.start.z + easeInOutCubic(uProgress) * (letterU.end.z - letterU.start.z);
          letterU.rotation.x = elements[3].rotation.x * (1 - easeInOutCubic(uProgress));
          letterU.rotation.y = elements[3].rotation.y * (1 - easeInOutCubic(uProgress));
          letterU.rotation.z = elements[3].rotation.z * (1 - easeInOutCubic(uProgress));
        }

        // Letter D assembly (4-6s)
        if (progress >= 0.36 && progress < 0.55) {
          const dProgress = (progress - 0.36) / 0.19;
          letterD.visible = true;
          letterD.position.x = letterD.start.x + easeInOutCubic(dProgress) * (letterD.end.x - letterD.start.x);
          letterD.position.y = letterD.start.y + easeInOutCubic(dProgress) * (letterD.end.y - letterD.start.y);
          letterD.position.z = letterD.start.z + easeInOutCubic(dProgress) * (letterD.end.z - letterD.start.z);
          letterD.rotation.x = elements[4].rotation.x * (1 - easeInOutCubic(dProgress));
          letterD.rotation.y = elements[4].rotation.y * (1 - easeInOutCubic(dProgress));
          letterD.rotation.z = elements[4].rotation.z * (1 - easeInOutCubic(dProgress));
        }

        // Energy pulse at assembly completion (6-6.5s)
        if (progress >= 0.55 && progress < 0.59) {
          const pulseProgress = (progress - 0.55) / 0.04;
          const pulseIntensity = Math.sin(pulseProgress * Math.PI);

          turquoiseMaterial.emissiveIntensity = 0.6 + pulseIntensity * 1.2;
          whiteMaterial.emissiveIntensity = 0.05 + pulseIntensity * 0.3;

          const scale = 1 + pulseIntensity * 0.05;
          emblem.scale.set(scale, scale, scale);
        } else if (progress >= 0.59) {
          emblem.scale.set(1, 1, 1);
        }

        // Orbital camera movement (6.5-9s)
        if (progress >= 0.59 && progress < 0.82) {
          const orbitProgress = (progress - 0.59) / 0.23;
          const orbitAngle = easeInOutCubic(orbitProgress) * Math.PI * 0.15;
          const radius = 35;
          camera.position.x = Math.sin(orbitAngle) * radius * 0.3;
          camera.position.z = 35 + Math.cos(orbitAngle) * radius * 0.1;
          camera.lookAt(0, 0, 0);
        }

        // Final light sweep (9-10s)
        if (progress >= 0.82 && progress < 0.91) {
          const sweepProgress = (progress - 0.82) / 0.09;
          keyLight.intensity = 1.5 + Math.sin(sweepProgress * Math.PI) * 0.8;
          rimLight.intensity = 0.8 + Math.sin(sweepProgress * Math.PI) * 0.5;
        }

        // Hold final state (10-11s)
        if (progress >= 0.91) {
          keyLight.intensity = 1.5;
          rimLight.intensity = 0.8;
          turquoiseMaterial.emissiveIntensity = 0.6;
          whiteMaterial.emissiveIntensity = 0.05;
          camera.position.set(0, 0, 35);
          camera.lookAt(0, 0, 0);

          emblem.rotation.z += 0.003;
        }
      }

      // Particle drift
      particles.rotation.y += 0.0002;
      particles.rotation.x += 0.0001;

      renderer.render(scene, camera);
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start animation
    animate();

  } catch (error) {
    console.error('Animation error:', error);
    document.getElementById('loader').style.display = 'none';
    const errorEl = document.getElementById('error');
    errorEl.textContent = 'Animation error: ' + error.message;
    errorEl.style.display = 'block';
  }
}

// Initialize when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initScene);
} else {
  initScene();
}
</script>

</body>
</html>
