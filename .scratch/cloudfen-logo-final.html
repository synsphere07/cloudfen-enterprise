<title>CloudFen</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  overflow: hidden;
  font-family: 'Segoe UI', system-ui, sans-serif;
  perspective: 1200px;
}

.container {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.logo-wrapper {
  position: relative;
  transform-style: preserve-3d;
  animation: cameraMovement 11s ease-in-out forwards;
}

.logo {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 70px;
  font-weight: 600;
  letter-spacing: -1px;
  transform-style: preserve-3d;
}

.letter {
  color: #fff;
  opacity: 0;
  transform-style: preserve-3d;
  text-shadow:
    3px 3px 6px rgba(0,0,0,0.9),
    0 0 30px rgba(255,255,255,0.15);
  filter: drop-shadow(0 8px 16px rgba(0,0,0,0.6));
}

.letter-c { animation: assembleC 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) 2s forwards; transform: translate3d(-300px, 100px, -200px) rotateX(30deg) rotateY(-50deg) rotateZ(20deg); }
.letter-l { animation: assembleL 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) 2.3s forwards; transform: translate3d(-250px, -120px, 180px) rotateX(-35deg) rotateY(35deg) rotateZ(-15deg); }
.letter-o { animation: assembleO 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) 2.6s forwards; transform: translate3d(0px, 180px, -180px) rotateX(25deg) rotateY(45deg) rotateZ(25deg); position: relative; }
.letter-u { animation: assembleU 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) 2.9s forwards; transform: translate3d(200px, -90px, 120px) rotateX(-28deg) rotateY(-38deg) rotateZ(18deg); }
.letter-d { animation: assembleD 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) 3.2s forwards; transform: translate3d(280px, 60px, -220px) rotateX(45deg) rotateY(25deg) rotateZ(-28deg); }
.letter-f { animation: assembleF 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) 3.5s forwards; transform: translate3d(-180px, 140px, 160px) rotateX(-42deg) rotateY(-30deg) rotateZ(22deg); }
.letter-e { animation: assembleE 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) 3.8s forwards; transform: translate3d(150px, -140px, -140px) rotateX(38deg) rotateY(42deg) rotateZ(-20deg); }
.letter-n { animation: assembleN 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) 4.1s forwards; transform: translate3d(320px, 90px, 190px) rotateX(-48deg) rotateY(-35deg) rotateZ(32deg); }

.emblem {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) translateZ(-500px) scale(0.3);
  width: 48px;
  height: 48px;
  opacity: 0;
  animation: emblemReveal 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0s forwards, emblemRotate 2.5s ease-out 0s;
  pointer-events: none;
}

.emblem-circle {
  width: 100%;
  height: 100%;
  border: 4px solid #4fd1c5;
  border-radius: 50%;
  position: relative;
  box-shadow: 0 0 25px rgba(79, 209, 197, 0.9), inset 0 0 25px rgba(79, 209, 197, 0.5), 0 0 50px rgba(79, 209, 197, 0.6);
  background: radial-gradient(circle, rgba(79, 209, 197, 0.2) 0%, transparent 70%);
}

.emblem-dot {
  position: absolute;
  width: 4px;
  height: 4px;
  background: #4fd1c5;
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(79, 209, 197, 1), 0 0 15px rgba(79, 209, 197, 0.7);
}

.emblem-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 12px;
  height: 12px;
  background: #4fd1c5;
  border-radius: 50%;
  box-shadow: 0 0 20px rgba(79, 209, 197, 1), 0 0 35px rgba(79, 209, 197, 0.8);
}

.particles {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #4fd1c5;
  border-radius: 50%;
  opacity: 0.4;
  animation: particleFloat 25s infinite ease-in-out;
}

.pulse-ring {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 120px;
  height: 120px;
  border: 4px solid #4fd1c5;
  border-radius: 50%;
  opacity: 0;
  box-shadow: 0 0 40px rgba(79, 209, 197, 0.8);
  animation: energyPulse 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 6s;
}

.flash {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: radial-gradient(circle, rgba(79, 209, 197, 0.3) 0%, transparent 70%);
  opacity: 0;
  pointer-events: none;
  animation: flashEffect 0.4s ease-out 6s;
}

.light-sweep {
  position: absolute;
  top: 0;
  left: -120%;
  width: 60%;
  height: 100%;
  background: linear-gradient(90deg, transparent 0%, rgba(79, 209, 197, 0.4) 50%, transparent 100%);
  animation: lightSweep 1.2s ease-out 9s;
  pointer-events: none;
  filter: blur(30px);
}

@keyframes cameraMovement {
  0% { transform: translateZ(0) scale(0.7); }
  70% { transform: translateZ(80px) scale(1); }
  82% { transform: translateZ(80px) rotateY(6deg) rotateX(-2deg); }
  100% { transform: translateZ(80px) rotateY(0deg) rotateX(0deg); }
}

@keyframes assembleC, @keyframes assembleL, @keyframes assembleO, @keyframes assembleU, @keyframes assembleD, @keyframes assembleF, @keyframes assembleE, @keyframes assembleN {
  to { opacity: 1; transform: translate3d(0, 0, 0) rotateX(0) rotateY(0) rotateZ(0); }
}

@keyframes emblemReveal {
  0% { opacity: 0; transform: translate(-50%, -50%) translateZ(-500px) scale(0.3) rotate(0deg); }
  100% { opacity: 1; transform: translate(-50%, -50%) translateZ(10px) scale(1) rotate(0deg); }
}

@keyframes emblemRotate {
  0% { transform: translate(-50%, -50%) translateZ(-500px) rotate(0deg) scale(0.3); }
  100% { transform: translate(-50%, -50%) translateZ(10px) rotate(720deg) scale(1); }
}

@keyframes energyPulse {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
  40% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(3); }
}

@keyframes flashEffect {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}

@keyframes lightSweep {
  from { left: -120%; }
  to { left: 120%; }
}

@keyframes particleFloat {
  0%, 100% { transform: translate3d(0, 0, 0); opacity: 0.4; }
  50% { transform: translate3d(var(--px), var(--py), var(--pz)); opacity: 0.15; }
}

@keyframes gentleGlow {
  0%, 100% { text-shadow: 3px 3px 6px rgba(0,0,0,0.9), 0 0 30px rgba(255,255,255,0.15); }
  50% { text-shadow: 3px 3px 6px rgba(0,0,0,0.9), 0 0 35px rgba(255,255,255,0.25), 0 0 50px rgba(79, 209, 197, 0.15); }
}

.final-glow {
  animation: gentleGlow 3s ease-in-out 9.5s infinite;
}
</style>

<div class="container">
  <div class="logo-wrapper">
    <div class="logo">
      <span class="letter letter-c">C</span>
      <span class="letter letter-l">l</span>
      <span class="letter letter-o">
        o
        <div class="emblem">
          <div class="emblem-circle">
            <div class="emblem-center"></div>
          </div>
        </div>
      </span>
      <span class="letter letter-u">u</span>
      <span class="letter letter-d">d</span>
      <span class="letter letter-f">F</span>
      <span class="letter letter-e">e</span>
      <span class="letter letter-n">n</span>
    </div>
    <div class="pulse-ring"></div>
  </div>

  <div class="flash"></div>
  <div class="light-sweep"></div>
  <div class="particles" id="particles"></div>
</div>

<script>
const emblemCircle = document.querySelector('.emblem-circle');

// Create concentric rings matching CloudFen logo
const rings = [
  { count: 8, radius: 8 },
  { count: 12, radius: 15 },
  { count: 16, radius: 21 }
];

rings.forEach(ring => {
  for (let i = 0; i < ring.count; i++) {
    const angle = (i / ring.count) * Math.PI * 2;
    const x = Math.cos(angle) * ring.radius;
    const y = Math.sin(angle) * ring.radius;
    const dot = document.createElement('div');
    dot.className = 'emblem-dot';
    dot.style.left = `calc(50% + ${x}px)`;
    dot.style.top = `calc(50% + ${y}px)`;
    emblemCircle.appendChild(dot);
  }
});

const particlesContainer = document.getElementById('particles');
for (let i = 0; i < 100; i++) {
  const particle = document.createElement('div');
  particle.className = 'particle';
  particle.style.left = Math.random() * window.innerWidth + 'px';
  particle.style.top = Math.random() * window.innerHeight + 'px';
  particle.style.setProperty('--px', (Math.random() - 0.5) * 150 + 'px');
  particle.style.setProperty('--py', (Math.random() - 0.5) * 150 + 'px');
  particle.style.setProperty('--pz', (Math.random() - 0.5) * 100 + 'px');
  particle.style.animationDelay = Math.random() * 15 + 's';
  particlesContainer.appendChild(particle);
}

setTimeout(() => {
  const emblem = document.querySelector('.emblem');
  emblem.style.animation += ', gentleEmblemRotate 15s linear 6s infinite';
  const style = document.createElement('style');
  style.textContent = '@keyframes gentleEmblemRotate { from { transform: translate(-50%, -50%) translateZ(10px) rotate(0deg); } to { transform: translate(-50%, -50%) translateZ(10px) rotate(360deg); } }';
  document.head.appendChild(style);
}, 6000);

setTimeout(() => {
  document.querySelectorAll('.letter').forEach(letter => letter.classList.add('final-glow'));
}, 9500);
</script>
